name: Rust CI (Nix)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust + Nix
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # On GitHub the runner doesn't have Nix; wrkflw emulation sets
      # runner.environment to "local", so it does not reinstall Nix.
      - name: Install Nix on GitHub-hosted runner
        if: ${{ runner.environment == 'github-hosted' }}
        uses: cachix/install-nix-action@v31

      - name: Show pinned toolchain
        run: nix develop --command rustc --version

      - name: Rustfmt
        run: nix develop --command cargo fmt --all -- --check

      - name: Clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: nix develop --command cargo test --all-targets --locked

      - name: Smoke test
        run: |
          output="$(nix develop --command cargo run --quiet --locked)"
          test "$output" = "Hello from local-ci-testing!"

      - name: Nix package check
        run: nix flake check --print-build-logs
