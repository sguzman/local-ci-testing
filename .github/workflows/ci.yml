name: Rust CI (Nix)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust + Nix
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Hosted GitHub runners install Nix; wrkflw on your host reuses yours.
      - name: Install Nix on GitHub-hosted runner
        if: ${{ runner.environment == 'github-hosted' }}
        uses: cachix/install-nix-action@v31

      # Use the lean CI shell; wrkflw itself is only needed locally.
      - name: Show pinned toolchain
        run: nix develop .#ci --command rustc --version

      - name: Rustfmt
        run: nix develop .#ci --command cargo fmt --all -- --check

      - name: Clippy
        run: nix develop .#ci --command cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: nix develop .#ci --command cargo test --all-targets --locked

      - name: Smoke test
        run: |
          output="$(nix develop .#ci --command cargo run --quiet --locked)"
          test "$output" = "Hello from local-ci-testing!"

      - name: Nix package check
        run: nix flake check --print-build-logs

      - name: Validate local status publisher syntax
        run: nix develop .#ci --command fish --no-execute scripts/run-local-ci.fish

      - name: Validate privacy cleanup script syntax
        run: nix develop .#ci --command fish --no-execute scripts/redact-previous-check.fish

      - name: Test CI reporting privacy
        run: |
          nix develop .#ci --command fish --no-execute scripts/ci-report.fish
          nix develop .#ci --command fish --no-execute scripts/test-ci-report.fish
          nix develop .#ci --command fish scripts/test-ci-report.fish
